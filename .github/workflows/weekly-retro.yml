name: Weekly Telecom Forge Retrospective

on:
  schedule:
    # 15:17 UTC Monday is 08:17 PDT and 07:17 PST, after the local week has started,
    # so the previous completed America/Los_Angeles ISO week is stable across DST.
    - cron: "17 15 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: ISO week, for example 2026-W43. Empty uses the previous completed Pacific week.
        required: false
        type: string
      dry_run:
        description: Compute the report without opening a pull request
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      week: ${{ steps.retro.outputs.week }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assume history reader role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.FORGE_HISTORY_WRITER_ROLE_ARN }}
          aws-region: ${{ vars.FORGE_AWS_REGION }}
      - name: Compute retrospective
        id: retro
        env:
          WEEK: ${{ inputs.week }}
          FORGE_HISTORY_BACKEND: s3
          FORGE_HISTORY_BUCKET: ${{ vars.FORGE_HISTORY_BUCKET }}
          AWS_REGION: ${{ vars.FORGE_AWS_REGION }}
          FORGE_MODEL_PROVIDER: ${{ vars.FORGE_MODEL_PROVIDER }}
          FORGE_MODEL_ID: ${{ vars.FORGE_MODEL_ID }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN}"
          args=(--dry-run --json)
          if [ -n "${WEEK}" ]; then args+=(--week "$WEEK"); fi
          pnpm forge retro "${args[@]}" > retro.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const report = JSON.parse(readFileSync("retro.json","utf8")); console.log(`week=${report.week}`);' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retro-report
          path: retro.json
          retention-days: 7

  publish_report:
    needs: analyze
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: retro-report
          path: retro-input
      - name: Mint metarepo draft-PR token
        id: retro-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FORGE_APP_ID }}
          private-key: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Write proposal files without editing skills
        env:
          WEEK: ${{ needs.analyze.outputs.week }}
          FORGE_HISTORY_BACKEND: filesystem
        run: |
          set -euo pipefail
          skill_hash="$(sha256sum .agents/skills/organization-navigation/SKILL.md)"
          pnpm forge retro --week "$WEEK" --propose --json
          test "$skill_hash" = "$(sha256sum .agents/skills/organization-navigation/SKILL.md)"
          echo "Trusted skills were not modified. Opening the draft pull request requires a human review of this branch."
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Weekly retrospective"
            echo ""
            echo "- Week: ${{ needs.analyze.outputs.week }}"
            echo "- The analyzer job has no pull-request write token."
            echo "- This publisher does not merge and does not edit skills in place."
          } >> "$GITHUB_STEP_SUMMARY"
