name: Reconcile Telecom Forge Outcomes

on:
  schedule:
    # 11:17 UTC is early morning in America/Los_Angeles in both PST and PDT.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: ISO date YYYY-MM-DD
        required: true
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mint read-only GitHub App token
        id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FORGE_APP_ID }}
          private-key: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
          owner: ${{ vars.FORGE_GITHUB_OWNER }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      - name: Assume history writer role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.FORGE_HISTORY_WRITER_ROLE_ARN }}
          aws-region: ${{ vars.FORGE_AWS_REGION }}
      - name: Reconcile
        env:
          SINCE: ${{ github.event_name == 'workflow_dispatch' && inputs.since || '2026-01-01' }}
          FORGE_GITHUB_TOKEN: ${{ steps.read-token.outputs.token }}
          FORGE_HISTORY_BACKEND: s3
          FORGE_HISTORY_BUCKET: ${{ vars.FORGE_HISTORY_BUCKET }}
          AWS_REGION: ${{ vars.FORGE_AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${FORGE_HISTORY_BUCKET}" ]; then
            echo "::error::FORGE_HISTORY_BUCKET is not configured. Reconciliation does not invent history."
            exit 1
          fi
          pnpm forge reconcile --since "$SINCE" --json
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Reconcile outcomes"
            echo ""
            echo "This job records review and merge observations. It does not merge pull requests."
          } >> "$GITHUB_STEP_SUMMARY"
